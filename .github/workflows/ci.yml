name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4

  quality:
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
      DATABASE_URL: ******localhost:5432/saas

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx prisma validate

      - run: npm audit --omit=dev

  test:
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
      DATABASE_URL: ******localhost:5432/saas

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [quality, test]

    env:
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
      DATABASE_URL: ******localhost:5432/saas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
